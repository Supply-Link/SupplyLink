plugins { id 'com.android.application' }
android {
    namespace 'com.supplylink.mobile'
    compileSdk 35
    defaultConfig { applicationId 'com.supplylink'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
    flavorDimensions 'role'
    productFlavors {
        retailer { dimension 'role'; applicationIdSuffix '.retailer'; buildConfigField 'String', 'ROLE', '"retailer"'; resValue 'string', 'app_name', 'SupplyLink Retailer' }
        delivery { dimension 'role'; applicationIdSuffix '.delivery'; buildConfigField 'String', 'ROLE', '"delivery"'; resValue 'string', 'app_name', 'SupplyLink Delivery' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
// Platform test APIs are provided by the test device, never bundled in either app.
dependencies {
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-35/optional/android.test.base.jar", "${android.sdkDirectory}/platforms/android-35/optional/android.test.runner.jar")
}
