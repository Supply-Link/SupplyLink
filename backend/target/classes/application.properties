spring.application.name=supplylink
server.port=${PORT:8080}

# PostgreSQL — set DATABASE_URL in environment or .env
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/supplylink}
spring.datasource.username=${DATABASE_USER:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# Disable Spring Boot auto Flyway/JPA — we manage the schema ourselves
spring.flyway.enabled=false
spring.jpa.open-in-view=false

# Jackson — snake_case JSON to match the existing API contract
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS origins (comma-separated, blank for same-host only)
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://192.168.29.237:5173}
app.cookie-secure=${COOKIE_SECURE:false}

logging.level.com.supplylink=INFO
